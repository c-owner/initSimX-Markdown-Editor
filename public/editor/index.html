    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111116;
            color: #eeeef4;
            font: 15px/1.55 "Paperlogy", "Malgun Gothic", sans-serif
        }

        button, input, select, textarea {
            font: inherit;
            color: inherit
        }

        button, select {
            background: #292933;
            border: 1px solid #454552;
            border-radius: 7px;
            padding: 7px 10px;
            cursor: pointer
        }

        button:hover, select:hover {
            border-color: #a78bfa
        }

        button:disabled {
            opacity: .45;
            cursor: default
        }

        header {
            height: 56px;
            border-bottom: 1px solid #30303b;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 14px
        }

        header a {
            color: #c4b5fd;
            text-decoration: none
        }

        header strong {
            font-size: 16px
        }

        .status {
            margin-left: auto;
            color: #b7b7c2;
            font-size: 12px
        }

        .app {
            height: calc(100vh - 56px);
            display: grid;
            grid-template-columns:260px minmax(0, 1fr);
            transition: grid-template-columns .2s
        }

        .app.sidebar-off {
            grid-template-columns:0 minmax(0, 1fr)
        }

        aside {
            overflow: auto;
            border-right: 1px solid #30303b;
            padding: 13px;
            min-width: 0;
            transition: padding .2s
        }

        .sidebar-off aside {
            padding-left: 0;
            padding-right: 0;
            overflow: hidden;
            border: 0
        }

        .sidehead {
            display: flex;
            gap: 6px;
            margin-bottom: 10px
        }

        input {
            min-width: 0;
            background: #1c1c24;
            border: 1px solid #41414d;
            border-radius: 7px;
            padding: 8px
        }

        .sidehead input {
            width: 100%
        }

        .file-create {
            width: 100%;
            margin: 0 0 8px;
            text-align: left
        }

        .tree {
            font-size: 14px
        }

        summary {
            cursor: pointer;
            color: #cbc8d4;
            padding: 5px 2px
        }

        .file {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: transparent;
            padding: 7px;
            border-radius: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .file.active, .file:hover {
            background: #292633;
            color: #ddd0ff
        }

        .hit {
            padding: 8px;
            border-bottom: 1px solid #30303b;
            cursor: pointer;
            font-size: 13px;
            overflow-wrap: anywhere
        }

        .hit small {
            display: block;
            color: #aaa;
            margin-top: 3px
        }

        .workspace {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column
        }

        .toolbar {
            min-height: 52px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 7px;
            border-bottom: 1px solid #30303b;
            flex-wrap: wrap
        }

        .filename {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 100px;
            max-width: 250px;
            margin-right: auto
        }

        .modebar {
            display: flex;
            gap: 3px;
            padding: 3px;
            background: #1c1c24;
            border: 1px solid #34343f;
            border-radius: 9px
        }

        .modebar button {
            border: 0;
            background: transparent;
            padding: 5px 9px;
            font-size: 13px
        }

        .modebar button.active {
            background: #373443;
            color: #e3d8ff
        }

        .toolbar select {
            padding: 6px
        }

        .toolbar .aux {
            font-size: 13px
        }

        .theme-picker { display:flex; align-items:center; gap:10px; padding:5px 10px; text-align:left; }
        .theme-picker-label { color:#a6a6b4; font-size:11px; }
        .theme-picker strong { font-size:12px; font-weight:600; }
        .theme-modal { position:fixed; inset:0; z-index:1001; display:none; place-items:center; padding:22px; background:#08080dc9; backdrop-filter:blur(9px); }
        .theme-modal.open { display:grid; animation:themeFade .16s ease-out; }
        @keyframes themeFade { from{opacity:0}to{opacity:1} }
        .theme-dialog { width:min(820px,100%); max-height:min(760px,90vh); overflow:auto; padding:24px; background:#1d1d26; border:1px solid #3c3c49; border-radius:18px; box-shadow:0 28px 100px #000a; }
        .theme-dialog-header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:20px; }
        .theme-dialog-header p { margin:0 0 5px; color:#a78bfa; font-size:10px; font-weight:700; letter-spacing:.15em; }
        .theme-dialog-header h2 { margin:0 0 4px; font-size:21px; }
        .theme-dialog-header span { color:#a7a7b5; font-size:13px; }
        .theme-dialog-header #themeDialogClose { width:34px; height:34px; padding:0; font-size:23px; line-height:1; }
        .theme-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:11px; }
        .theme-card { min-height:115px; padding:0; overflow:hidden; border:1px solid #40404d; border-radius:12px; background:#25252f; text-align:left; transition:transform .15s,border-color .15s,box-shadow .15s; }
        .theme-card:hover { transform:translateY(-2px); border-color:#a78bfa; }
        .theme-card[aria-pressed="true"] { border-color:#b9a3ff; box-shadow:0 0 0 2px #a78bfa44; }
        .theme-swatch { height:72px; padding:10px; background:var(--swatch-bg,#f6f6f6); color:var(--swatch-fg,#333); }
        .theme-swatch i { display:block; height:6px; width:52%; margin:3px 0 8px; border-radius:8px; background:var(--swatch-accent,#7c6ee6); }
        .theme-swatch b { display:block; width:76%; height:5px; margin:5px 0; border-radius:8px; background:currentColor; opacity:.72; }
        .theme-swatch b:last-child { width:47%; opacity:.38; }
        .theme-card-label { display:flex; align-items:center; justify-content:space-between; padding:10px 11px; font-size:12px; font-weight:600; }
        .theme-card-label small { color:#8f8f9e; font-size:10px; font-weight:500; }
        @media(max-width:600px) { .theme-dialog{padding:17px}.theme-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.theme-card{min-height:102px}.theme-swatch{height:62px} }

        .stage {
            flex: 1;
            min-height: 0;
            position: relative;
            background: #202027;
            overflow: auto
        }

        .pane {
            height: 100%;
            min-height: 0;
            overflow: auto;
            box-sizing: border-box
        }

        .reader-pane, .visual-pane {
            display: none
        }

        .mode-read .reader-pane, .mode-visual .visual-pane {
            display: block
        }

        .mode-source .source-pane {
            display: block
        }

        .mode-split .source-pane, .mode-split .reader-pane {
            display: block
        }

        .stage.mode-split {
            display: grid;
            grid-template-columns:minmax(0, 1fr) minmax(0, 1fr)
        }

        .mode-split .source-pane {
            border-right: 1px solid #393943
        }

        .source-pane {
            display: none
        }

        .edit {
            display: block;
            width: 100%;
            height: 100%;
            resize: none;
            border: 0;
            outline: none;
            background: #17171e;
            color: #e7e5ed;
            padding: 28px clamp(18px, 4vw, 56px);
            font: 14px/1.75 Consolas, "Malgun Gothic", monospace;
            tab-size: 2;
            white-space: pre;
            overflow: auto
        }

        .reader-pane {
            padding: 38px 20px;
            background: #24242b
        }

        .reader {
            --doc-width: 820px;
            width: min(var(--doc-width), 100%);
            margin: 0 auto;
            background: #fff;
            color: #333;
            padding: 52px clamp(24px, 6vw, 72px);
            border-radius: 5px;
            box-shadow: 0 8px 30px #0003;
            min-height: 80vh;
            font-family: "Paperlogy", "Malgun Gothic", sans-serif;
            font-size: 16px;
            line-height: 1.85;
            overflow-wrap: anywhere
        }

        .reader.theme-dark, .visual.theme-dark {
            background: #25252b;
            color: #e7e5ed;
            color-scheme: dark
        }

        .reader.theme-light, .visual.theme-light {
            background: #fff;
            color: #333;
            color-scheme: light
        }

        .reader.theme-dark, .visual.theme-dark { color:#e7e5ed; }
        .reader.theme-dark :not([style*="color:"]),
        .visual.theme-dark :not([style*="color:"]) { color: inherit; }
        .reader.theme-dark pre, .visual.theme-dark pre { background:#1b1b20 !important; color:#e7e5ed !important; border:1px solid #45454f; }
        .reader.theme-dark pre code, .visual.theme-dark pre code,
        .reader.theme-dark code, .visual.theme-dark code { background:#303039 !important; color:#e7e5ed !important; }
        .reader.theme-dark .vditor-reset, .visual.theme-dark .vditor-reset { color:#e7e5ed !important; }
        .reader.theme-dark .vditor-reset *, .visual.theme-dark .vditor-reset * { color:inherit; }
        .reader.theme-dark .vditor-reset pre, .visual.theme-dark .vditor-reset pre { background:#1b1b20 !important; color:#e7e5ed !important; }
        .reader.theme-dark .vditor-reset pre code, .visual.theme-dark .vditor-reset pre code,
        .reader.theme-dark .vditor-reset code:not(.hljs), .visual.theme-dark .vditor-reset code:not(.hljs) { background:#303039 !important; color:#e7e5ed !important; }
        .reader.theme-dark a, .visual.theme-dark a { color:#b9caff; }
        .reader.theme-dark .vditor-reset a, .visual.theme-dark .vditor-reset a { color:#b9caff; }
        .reader.theme-dark table th, .reader.theme-dark table td,
        .visual.theme-dark table th, .visual.theme-dark table td { border-color:#555560; }
        .visual.theme-dark .vditor-preview { background:#25252b !important; color:#e7e5ed !important; }
        .reader.theme-light, .visual.theme-light { color:#29292e; }
        .reader.theme-light .vditor-reset, .visual.theme-light .vditor-reset { color:#29292e !important; }
        .reader.theme-light .vditor-reset pre, .visual.theme-light .vditor-reset pre { background:#f0f0f2 !important; color:#29292e !important; border:1px solid #dedee3; }
        .reader.theme-light .vditor-reset pre code, .visual.theme-light .vditor-reset pre code,
        .reader.theme-light .vditor-reset code:not(.hljs), .visual.theme-light .vditor-reset code:not(.hljs) { background:#e9e9ed !important; color:#303038 !important; }

        .visual-pane {
            padding: 38px 20px;
            background: #24242b;
            box-sizing: border-box
        }

        .visual {
            width: min(var(--doc-width, 820px), 100%);
            height: 100%;
            min-height: 0;
            margin: 0 auto;
            padding: 52px clamp(24px, 6vw, 72px);
            border-radius: 5px;
            box-shadow: 0 8px 30px #0003;
            outline: none;
            overflow-wrap: anywhere;
            box-sizing: border-box
        }

        .visual > .vditor {
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 0;
            background: transparent
        }
        .visual .vditor-toolbar { display: none }
        .visual .vditor-content { background: transparent }
        .visual .vditor-preview__action { display: none }
        .visual.theme-dark .vditor-preview { background:#25252b !important; color:#e7e5ed !important; }
        .visual.theme-dark .vditor-preview .vditor-reset,
        .visual.theme-dark .vditor-preview .vditor-reset * { color:#e7e5ed !important; }
        .visual.theme-dark .vditor-preview .vditor-reset a { color:#b9caff !important; }
        .visual.theme-dark .vditor-preview .vditor-reset pre,
        .visual.theme-dark .vditor-preview .vditor-reset pre code { background:#1b1b20 !important; color:#e7e5ed !important; border-color:#45454f !important; }
        .visual.theme-dark .vditor-preview .vditor-reset code:not(.hljs) { background:#303039 !important; color:#e7e5ed !important; }
        .visual.theme-dark .vditor-preview .vditor-reset table th,
        .visual.theme-dark .vditor-preview .vditor-reset table td { border-color:#555560 !important; }
        .visual.theme-light .vditor-preview { background:#fff !important; color:#29292e !important; }
        .visual.theme-light .vditor-preview .vditor-reset,
        .visual.theme-light .vditor-preview .vditor-reset * { color:#29292e !important; }
        .visual.theme-light .vditor-preview .vditor-reset pre,
        .visual.theme-light .vditor-preview .vditor-reset pre code { background:#f0f0f2 !important; color:#29292e !important; border-color:#dedee3 !important; }
        .visual.theme-light .vditor-preview .vditor-reset code:not(.hljs) { background:#e9e9ed !important; color:#303038 !important; }

        .visual:focus {
            box-shadow: 0 8px 30px #0003, 0 0 0 2px #9d83ef
        }

        .visual-notice {
            display: none;
            margin: 0 auto 14px;
            max-width: 820px;
            padding: 10px 14px;
            border: 1px solid #8b6f35;
            border-radius: 8px;
            background: #382f1f;
            color: #f2d99b;
            font-size: 13px
        }
        .visual-notice.visible { display: block }

        .reader img, .visual img {
            max-width: 100%;
            height: auto
        }

        .reader table, .visual table {
            max-width: 100%;
            border-collapse: collapse;
            display: block;
            overflow-x: auto
        }

        .reader pre, .visual pre, .reader code, .visual code {
            font-family: Consolas, "Cascadia Code", monospace
        }

        .reader pre, .visual pre {
            padding: 16px 18px;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            overflow-x: auto
        }

        .reader code, .visual code {
            overflow-wrap: anywhere;
            word-break: break-word
        }

        .reader blockquote, .visual blockquote {
            margin-left: 0;
            padding-left: 18px;
            border-left: 4px solid #aaa
        }

        .reader iframe, .visual iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 72vh;
            border: 1px solid #454552;
            border-radius: 9px;
            background: transparent;
            box-shadow: 0 12px 34px #0007
        }

        .empty {
            color: #777;
            text-align: center;
            margin-top: 28vh
        }

        .modal {
            position: fixed;
            inset: 0;
            background: #0009;
            display: none;
            place-items: center;
            z-index: 5
        }

        .dialog {
            background: #202027;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 22px;
            max-width: 640px;
            width: 90%;
            max-height: 80vh;
            overflow: auto
        }

        .dialog h2 {
            margin-top: 0
        }

        .dialog p {
            color: #aaa
        }

        .conflict {
            border: 1px solid #a87936;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px
        }

        .width-control {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #b7b7c2
        }

        .width-control input {
            width: 90px;
            padding: 4px
        }

        .hint {
            font-size: 12px;
            color: #9895a3;
            margin-left: 8px
        }

        @media (max-width: 900px) {
            .app {
                grid-template-columns:220px minmax(0, 1fr)
            }

            .filename {
                max-width: 150px
            }
        }

        @media (max-width: 650px) {
            header {
                padding: 0 10px
            }

            .app {
                grid-template-columns:190px minmax(0, 1fr)
            }

            .app.sidebar-off {
                grid-template-columns:0 minmax(0, 1fr)
            }

            aside {
                padding: 9px
            }

            .toolbar {
                gap: 5px;
                padding: 7px
            }

            .filename {
                flex-basis: 40%;
                margin-right: auto
            }

            .modebar {
                order: 3
            }

            .toolbar select {
                order: 4
            }

            .toolbar .aux {
                order: 5
            }

            .stage.mode-split {
                display: flex;
                flex-direction: column
            }

            .mode-split .pane {
                height: 50%
            }

            .mode-split .source-pane {
                border-right: 0;
                border-bottom: 1px solid #393943
            }

            .reader-pane, .visual-pane {
                padding: 14px 8px
            }

            .reader, .visual {
                padding: 28px 20px
            }

            .visual .vditor-content {
                display: flex;
                flex-direction: column;
                overflow-y: auto
            }
            .visual .vditor-sv,
            .visual .vditor-preview {
                flex: 1 0 320px;
                width: 100% !important;
                max-width: 100% !important;
                min-width: 0
            }

            .hint {
                display: none
            }
        }
    </style>

<body>
<header class="site-header"><a class="brand" href="/">◈ initSimX</a><nav class="site-nav" aria-label="주 메뉴"><a href="/editor/" aria-current="page">마크다운 편집기</a><a href="/helper/프로필_생성기.html" target="_blank" rel="noopener">프로필 생성기</a><a href="/helper/프로필카드_생성기.html" target="_blank" rel="noopener">카드 미리보기</a></nav><button id="connect">로컬 폴더 연결</button><button id="disconnect" type="button" hidden>연결 해제</button><span class="status" id="status" role="status">준비 중…</span></header>
<div class="app" id="app">
    <aside>
        <button id="connectSide" type="button">로컬 폴더 연결</button>
        <div class="sidehead"><input id="search" placeholder="파일·내용 검색">
            <button id="refresh" title="새로고침">↻</button>
        </div>
        <button class="file-create" id="demo">예시 문서로 둘러보기</button>
        <button class="file-create" id="createFile">＋ 새 Markdown 파일</button>
        <div style="display:flex;gap:6px;margin:8px 0"><select id="fileSort" aria-label="파일 정렬 기준" style="min-width:0;flex:1"><option value="name">이름순</option><option value="modified">수정일순</option></select><select id="fileDirection" aria-label="파일 정렬 방향" style="min-width:0;flex:1"><option value="asc">오름차순</option><option value="desc">내림차순</option></select></div><div class="tree" id="tree"></div>
        <div id="results"></div>
        <hr>
        <p>문서는 선택한 PC 폴더에 저장됩니다. 저장 전 사본은 .initsimx-backups 폴더에 보관됩니다.</p><button id="download">편집 내용 내려받기</button>

    <main class="workspace">

                <button class="active" data-mode="read">읽기</button>
                <button data-mode="visual">Markdown 편집</button>
                <button data-mode="source">소스</button>
                <button data-mode="split">소스+미리보기</button>
            </div>
            <label class="width-control" title="문서 폭">폭 <input id="docWidth" max="1100" min="620" step="20" type="range" value="820"></label>

                <span id="fontSizeValue">16px</span>

                <option value="adark">Adark</option><option value="alfluent">Alfluent</option>
                <option value="drake">Drake</option><option value="drake-black">Drake Black</option>
                <option value="drake-dark">Drake Dark</option><option value="drake-google">Drake Google</option>
                <option value="drake-light">Drake Light</option><option value="drake-material">Drake Material</option>
                <option value="drake-purple">Drake Purple</option><option value="drake-vue">Drake Vue</option>
                <option value="fluent">Fluent</option><option value="github">GitHub</option>
                <option value="mo">Mo</option><option value="mo-dark">Mo Dark</option>

            <select id="documentFont" aria-label="문서 글꼴"><option value="paperlogy">페이퍼로지</option><option value="theme">테마 기본 글꼴</option><option value="sans">맑은 고딕</option><option value="serif">바탕</option><option value="mono">고정폭</option></select><button disabled id="save">저장</button>

</div>

<script src="/vendor/vditor/dist/js/lute/lute.min.js"></script><script src="/local-files.js"></script><script src="/vendor/vditor/dist/index.min.js"></script>
<script>
    const $ = id => document.getElementById(id);
    let demoMode=false;
    let csrf = '', files = [], current = null, baseHash = null, dirty = false, timer = null, mode = 'read', visualChanged = false, rawHTML = false, renderTimer = null, vditor = null;

    const uiModal = document.createElement('div');
    uiModal.className = 'ui-modal';
    uiModal.innerHTML = '<section class="ui-dialog" role="dialog" aria-modal="true" aria-labelledby="uiTitle"><div class="ui-icon">✦</div><h2 id="uiTitle"></h2><p class="ui-message"></p><input class="ui-input" hidden><div class="ui-actions"><button class="ui-cancel">취소</button><button class="ui-ok">확인</button></div></section>';
    document.body.append(uiModal);
    const uiStyle = document.createElement('style');
    uiStyle.textContent = '.ui-modal{position:fixed;inset:0;z-index:1000;display:none;place-items:center;padding:20px;background:#08080dbb;backdrop-filter:blur(7px)}.ui-modal.open{display:grid;animation:uiFade .16s ease-out}@keyframes uiFade{from{opacity:0}to{opacity:1}}.ui-dialog{width:min(430px,100%);padding:26px;background:#202029;border:1px solid #454552;border-radius:18px;box-shadow:0 24px 80px #0009;animation:uiPop .18s ease-out}@keyframes uiPop{from{transform:translateY(8px) scale(.98)}to{transform:none}}.ui-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#a78bfa20;color:#c4b5fd;font-size:21px}.ui-dialog h2{margin:14px 0 6px;font-size:19px}.ui-message{margin:0;color:#b8b8c6;white-space:pre-wrap;overflow-wrap:anywhere}.ui-input{width:100%;margin-top:16px;padding:10px 12px;background:#15151c;border:1px solid #454552;border-radius:9px;outline:none}.ui-input:focus{border-color:#a78bfa}.ui-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.ui-actions button{min-width:82px}.ui-actions .ui-ok{background:#a78bfa;color:#17131f;border-color:transparent;font-weight:700}.ui-actions .ui-danger{background:#d1788b;color:#1b1115;border-color:transparent;font-weight:700}';
    document.head.append(uiStyle);
    function dialog({title='알림', message='', kind='alert', value='', danger=false}={}) {
        return new Promise(resolve => {
            const input=uiModal.querySelector('.ui-input'), ok=uiModal.querySelector('.ui-ok'), cancel=uiModal.querySelector('.ui-cancel');
            uiModal.querySelector('#uiTitle').textContent=title;
            uiModal.querySelector('.ui-message').textContent=message;
            input.hidden=kind!=='prompt'; input.value=value;

            uiModal.classList.add('open');
            const done=result=>{uiModal.classList.remove('open');ok.onclick=cancel.onclick=null;uiModal.onkeydown=null;resolve(result)};
            ok.onclick=()=>done(kind==='prompt'?input.value:kind==='confirm'?true:true); cancel.onclick=()=>done(kind==='prompt'?null:false);
            uiModal.onclick=e=>{if(e.target===uiModal)done(kind==='prompt'?null:false)};
            uiModal.onkeydown=e=>{if(e.key==='Escape')done(kind==='prompt'?null:false);if(e.key==='Enter'&&e.target!==document.body){e.preventDefault();ok.click()}};
            setTimeout(()=>kind==='prompt'?input.focus():ok.focus(),0);
        });
    }
    const notify=(message,title='알림')=>dialog({title,message,kind:'alert'});
    const confirmUI=(message,title='확인',danger=false)=>dialog({title,message,kind:'confirm',danger});
    const promptUI=(message,value,title='이름 입력')=>dialog({title,message,value,kind:'prompt'});

    const localFiles = new LocalFiles();
    const api = (url, opts) => localFiles.request(url, opts);
    const connectLocalFolder = async () => {
        if (!window.showDirectoryPicker || !window.isSecureContext) { await notify('HTTPS 또는 localhost의 Chrome/Edge에서 열어 주세요.'); return; }
        if (!localFiles.root && localFiles.remembered) { try { await localFiles.requestRememberedPermission(); } catch {} }
        if (!(await flushPendingChanges())) return;
        try { await localFiles.connect();clearTimeout(renderTimer);++renderVersion;demoMode=false;current=null; baseHash=null; dirty=false; visualChanged=false;
            $('text').value=''; $('text').disabled=true; $('save').disabled=true; $('renameFile').disabled=true; $('deleteFile').disabled=true;
            $('filename').textContent=localFiles.root.name; $('reader').replaceChildren();
            if(vditor && editorReady)vditor.setValue('',true);
            render(); $('createFile').disabled=false; $('connectSide').textContent='폴더: '+localFiles.root.name; $('connect').textContent='폴더: '+localFiles.root.name; $('disconnect').hidden=false; await loadTree(); status('연결됨 · '+localFiles.root.name);
        } catch(e) { if(e.name!=='AbortError')status(e.message); }
    };
    $('connect').onclick=connectLocalFolder;
    $('connectSide').onclick=connectLocalFolder;
    $('disconnect').onclick=async()=>{if(save.busy||!await flushPendingChanges())return;if(!await confirmUI('폴더 연결을 해제할까요? 다음 방문 때 다시 연결해야 합니다.'))return;await localFiles.disconnect();clearTimeout(timer);clearTimeout(renderTimer);++renderVersion;current=null;baseHash=null;dirty=false;demoMode=false;$('text').value='';$('text').disabled=true;$('save').disabled=true;$('renameFile').disabled=true;$('deleteFile').disabled=true;$('createFile').disabled=true;$('filename').textContent='폴더 연결 해제됨';$('connect').textContent='로컬 폴더 연결';$('connectSide').textContent='로컬 폴더 연결';$('disconnect').hidden=true;await loadTree();render();status('폴더 연결을 해제했습니다.');};
    $('demo').onclick=async()=>{
        if(save.busy)return;
        if(dirty && !await confirmUI('편집 중인 내용을 버리고 예시 문서를 열까요?'))return;
        clearTimeout(timer);
        const response=await fetch('/example.md');if(!response.ok)return;
        demoMode=true;current='예시 문서.md';baseHash=null;dirty=false;visualChanged=false;
        $('text').value=await response.text();$('text').disabled=false;$('filename').textContent='예시 문서 · PC 저장 없음';
        $('save').disabled=true;$('renameFile').disabled=true;$('deleteFile').disabled=true;
        if(mode==='visual')ensureVditor($('text').value);
        render();status('예시 문서 · 파일을 수정하지 않습니다.');
    };
    $('download').onclick=()=>{const blob=new Blob([$('text').value],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=current?.split('/').pop()||'복구 메모.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
    window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

    function status(s) {
        $('status').textContent = s
    }

    function setMode(next) {
        if (visualChanged && !commitVisual()) return;
        if(next === 'visual' && current) ensureVditor($('text').value);
        mode = next;

        $('stage').className = 'stage mode-' + mode;
        applyTheme();
        document.querySelectorAll('.modebar button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
        applyTheme();
        if (vditor && editorReady) {
            if (mode === 'visual') vditor.enable();
            else vditor.disabled()
        }
        render();
        localStorage.setItem('aichat-editor-mode', mode)
    }

    function setWidth(v) {
        document.querySelectorAll('.reader,.visual').forEach(e => e.style.setProperty('--doc-width', v + 'px'));
        localStorage.setItem('aichat-doc-width', v)
    }

    async function init() {
        const restored=await localFiles.restore();
        if(restored){$('connect').textContent='폴더: '+localFiles.root.name;$('connectSide').textContent='폴더: '+localFiles.root.name;$('disconnect').hidden=false;$('createFile').disabled=false;status('폴더 자동 연결됨 · '+localFiles.root.name);}
        else if(localFiles.remembered){$('connect').textContent='폴더 권한 다시 승인';$('connectSide').textContent='저장된 폴더 다시 연결';status('저장된 폴더가 있습니다. 버튼을 눌러 접근을 승인하세요.');}
        csrf = (await api('/api/session')).csrf;
        $('createFile').disabled = !localFiles.root;
        if(!localFiles.root&&!localFiles.remembered)$('connectSide').textContent='로컬 폴더 연결';
        $('docWidth').value = localStorage.getItem('aichat-doc-width') || 820;
        setWidth($('docWidth').value);
        await loadTree();
        setMode('read'); if(!localFiles.root&&!localFiles.remembered)status('로컬 폴더를 연결해 시작하세요 · 문서 업로드 없음')
    }

    async function loadTree() {
        const d = await api('/api/tree');
        files = d.files;
        const root = Object.create(null);
        files.forEach(f => {
            let n = root;
            const p = f.path.split('/');
            p.forEach((part, i) => {
                if (i === p.length - 1) n[part] = f; else n = n[part] ??= Object.create(null)
            })
        });
        let box = $('tree');
        box.replaceChildren();
        const draw = (obj, prefix = '') => Object.keys(obj).sort((a,b)=>{
            const x=obj[a],y=obj[b];
            if(Boolean(x.path)!==Boolean(y.path))return x.path?1:-1;
            const direction=$('fileDirection').value==='desc'?-1:1;
            const name=a.localeCompare(b,'ko',{numeric:true,sensitivity:'base'});
            if($('fileSort').value==='modified'&&x.path&&y.path)return direction*((x.lastModified||0)-(y.lastModified||0)||name);
            return direction*name;
        }).forEach(k => {
            const v = obj[k], path = prefix ? prefix + '/' + k : k;
            if (v.path) {
                const b = document.createElement('button');
                b.className = 'file' + (current === v.path ? ' active' : '');
                b.textContent = '📄 ' + k;
                b.title = v.path;
                b.onclick = () => openFile(v.path);
                box.append(b)
            } else {
                const d = document.createElement('details');
                d.open = true;
                const s = document.createElement('summary');
                s.textContent = '📁 ' + k;
                d.append(s);
                const child = document.createElement('div');
                child.style.paddingLeft = '12px';
                d.append(child);
                box.append(d);
                const tmp = box;
                box = child;
                draw(v, path);
                box = tmp
            }
        });
        draw(root)
    }

    async function openFile(path) {
        if(save.busy){status('저장이 끝난 뒤 파일을 열어 주세요.');return;}
        if (dirty && !await confirmUI('저장되지 않은 내용을 버리고 파일을 바꿀까요?', '변경 내용 확인', true)) return;
        clearTimeout(timer);
        const d = await api('/api/file?path=' + encodeURIComponent(path));
        demoMode=false;current = path;
        baseHash = d.hash;
        dirty = false;
        rawHTML = containsHTML(d.content);
        $('text').value = d.content;
        $('text').disabled = false;
        $('save').disabled = false;
        $('renameFile').disabled = false;
        $('deleteFile').disabled = false;
        $('filename').textContent = path;
        visualChanged = false;
        status('저장됨');
        await loadTree();
        if(mode==='visual')ensureVditor(d.content);
        render()
    }

    let editorReady=false, pendingEditorValue='';
    function ensureVditor(value) {
        pendingEditorValue=value;
        if (vditor) {
            if(editorReady && vditor.getValue() !== value) vditor.setValue(value, true);
            return
        }
        vditor = new Vditor('markdownEditor', {
            cdn: '/vendor/vditor',
            lang: 'ko_KR',
            mode: 'sv',
            theme: $('theme').value === 'less-dark' ? 'dark' : 'classic',
            height: '100%',
            minHeight: 0,
            toolbar: [],
            cache: {enable: false},
            value,
            preview: {
                mode: 'editor',
                markdown: {sanitize: true},
                theme: {current: $('theme').value === 'less-dark' ? 'dark' : 'light', path: '/vendor/vditor/dist/css/content-theme'},
                hljs: {style: $('theme').value === 'less-dark' ? 'github-dark' : 'github'}
            },
            input: markdown => {
                $('text').value = markdown;
                visualChanged = true;
                dirty = true;
                scheduleRender();
                status('수정됨 · Vditor Markdown 저장 대기');
                clearTimeout(timer);
                timer = setTimeout(() => {
                    $('text').value = vditor.getValue();
                    visualChanged = false;
                    save()
                }, 900)
            },
            after: () => {
                editorReady=true;
                if(vditor.getValue()!==pendingEditorValue)vditor.setValue(pendingEditorValue,true);
                vditor.setPreviewMode('editor');
                applyTheme();
                status('편집기 준비됨');
                if (mode === 'visual') vditor.enable();
                else vditor.disabled()
            }
        })
    }

    function bindVditorScrollSync() {
        const host = $('visual');
        const source = host.querySelector('.vditor-sv');
        const preview = host.querySelector('.vditor-preview');
        if (!source || !preview || source.dataset.scrollSync === '1') return;
        source.dataset.scrollSync = '1';
        let syncing = false;
        const syncPreview = () => {
            if (syncing || mode !== 'visual') return;
            syncing = true;
            const sourceRange = source.scrollHeight - source.clientHeight;
            const previewRange = preview.scrollHeight - preview.clientHeight;
            const ratio = sourceRange > 0 ? source.scrollTop / sourceRange : 0;
            preview.scrollTop = Math.max(0, ratio * previewRange);
            requestAnimationFrame(() => { syncing = false; });
        };
        source.addEventListener('scroll', syncPreview, {passive:true});
        source.addEventListener('keyup', syncPreview);
        source.addEventListener('click', syncPreview);
        source.addEventListener('input', () => requestAnimationFrame(syncPreview));
    }

    function esc(s) {
        return s.replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]))
    }

    function containsHTML(source) {
        let fenced = false;
        return source.split(/\r?\n/).some(line => {
            if (/^\s*```/.test(line)) { fenced = !fenced; return false }
            return !fenced && /<\/?[a-z][a-z0-9-]*(?:\s[^<>]*?)?\s*\/?\s*>/i.test(line)
        })
    }

    function inline(s) {
        // 렌더러가 아는 인라인 HTML 태그는 보존하고, 나머지 텍스트는 계속 이스케이프한다.
        const allowed = /^(?:\/?(?:img|span|a|br|strong|b|em|i|u|s|small|sup|sub|code|mark|kbd|label)(?:\s[^<>]*?)?\s*\/?)$/i;
        const html = s.split(/(<\/?[a-z][a-z0-9-]*(?:\s[^<>]*?)?\s*\/?>)/gi).map(part => part.startsWith('<') && part.endsWith('>') && allowed.test(part.slice(1, -1).trim()) ? part : esc(part)).join('');
        return html.replace(/!\[([^\]]*)\]\(([^ )]+)\)/g, '<img alt="$1" src="$2">').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^ )]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    }

    function markdownToHTML(src) {
        const parts = src.split(/\r?\n/), out = [];
        let para = [], list = '', code = false, codeLines = [];
        const flush = () => {
            if (para.length) {
                out.push('<p>' + para.map(inline).join('<br>') + '</p>');
                para = []
            }
        };
        for (let i = 0; i < parts.length; i++) {
            const line = parts[i];
            if (line.trim().startsWith('```')) {
                flush();
                if (!code) {
                    code = true;
                    codeLines = []
                } else {
                    out.push('<pre><code>' + esc(codeLines.join('\n')) + '</code></pre>');
                    code = false
                }
                continue
            }
            if (code) {
                codeLines.push(line);
                continue
            }
            if (/^\s*<(?:div|table|section|article|details|figure|header|footer|nav|main|aside|blockquote|pre|ul|ol|h[1-6])(?:\s|>)/i.test(line)) {
                flush();
                const raw = [line];
                while (i + 1 < parts.length && parts[i + 1].trim()) raw.push(parts[++i]);
                out.push(raw.join('\n'));
                continue
            }
            const h = line.match(/^(#{1,6})\s+(.+)/);
            if (h) {
                flush();
                out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`)
            } else if (/^\s*([-*])\s+/.test(line)) {
                flush();
                if (!list) {
                    list = 'ul';
                    out.push('<ul>')
                }
                out.push('<li>' + inline(line.replace(/^\s*[-*]\s+/, '')) + '</li>')
            } else {
                if (list) {
                    out.push('</ul>');
                    list = ''
                }
                if (!line.trim()) flush(); else para.push(line)
            }
        }
        flush();
        if (list) out.push('</ul>');
        if (code) out.push('<pre><code>' + esc(codeLines.join('\n')) + '</code></pre>');
        return out.join('') || '<p>내용이 없습니다</p>'
    }

    let appliedEditorTheme=null;
    const darkThemes=new Set(['less-dark','adark','drake-black','drake-dark','drake-material','drake-purple','mo-dark','notes-dark']);
    function applyTheme() {
        const selectedTheme=$('theme').value;
        const dark=darkThemes.has(selectedTheme);
        $('stage').dataset.theme=dark?'dark':'light';
        $('stage').dataset.documentTheme=selectedTheme;
        $('reader').classList.toggle('theme-dark',dark);
        $('reader').classList.toggle('theme-light',!dark);
        $('visual').classList.toggle('theme-dark',dark);
        $('visual').classList.toggle('theme-light',!dark);
        if(vditor && editorReady && appliedEditorTheme!==dark){vditor.setTheme(dark?'dark':'classic',dark?'dark':'light',dark?'github-dark':'github','/vendor/vditor/dist/css/content-theme');appliedEditorTheme=dark;}
    }
    const themeCache=new Map();
    async function documentCSS(theme){
        const themeFile=theme==='less-light'?'less-light':theme==='less-dark'?'less-dark':theme;
        if(!themeCache.has(theme))themeCache.set(theme,(async()=>{const path='/themes/'+themeFile+'.css';const response=await fetch(path);if(!response.ok)throw Error('문서 테마를 불러올 수 없습니다: '+path);return path;})().catch(error=>{themeCache.delete(theme);throw error;}));
        return themeCache.get(theme);
    }
    let renderVersion=0, previewURLs=[];
    function scheduleRender(){clearTimeout(renderTimer);renderTimer=setTimeout(render,150);}
    async function render() {
        applyTheme();
        const version=++renderVersion;
        if(!current){
            previewURLs.forEach(URL.revokeObjectURL);previewURLs=[];
            for(const id of ['reader','visualPreview']){$(id).replaceChildren();const hint=document.createElement('p');hint.className='empty';hint.textContent='로컬 폴더를 연결하거나 예시 문서를 열어 주세요.';$(id).append(hint);}
            return;
        }
        try {
            const css=await documentCSS($('theme').value);
            const doc=new DOMParser().parseFromString(Lute.New().Md2HTML($('text').value),'text/html');
            doc.querySelectorAll('script,iframe,object,embed,link,meta,base,form').forEach(node=>node.remove());
            const urls=[];
            for(const img of doc.querySelectorAll('img')){
                img.removeAttribute('srcset');
                const src=img.getAttribute('src')||'';
                if(src.startsWith('data:image/'))continue;
                try {
                    if(/^https:\/\//i.test(src) && !src.startsWith('https://static.wikia.nocookie.net/')){
                        img.src=src;
                        continue;
                    }
                    if(/^http:\/\/init\.n-e\.kr:8081\//i.test(src)||src.startsWith('https://static.wikia.nocookie.net/')){
                        const proxy='/image-proxy?url='+encodeURIComponent(src);
                        const response=await fetch(proxy);
                        if(!response.ok)throw Error('원격 이미지 요청에 실패했습니다.');
                        const blob=await response.blob();
                        if(!blob.type.startsWith('image/'))throw Error('이미지 파일이 아닙니다.');
                        const url=URL.createObjectURL(blob);urls.push(url);img.src=url;
                        continue;
                    }
                    if(/^[a-z]+:|^\/\//i.test(src))throw Error();
                    const parts=current.split('/').slice(0,-1);
                    for(const p of decodeURIComponent(src).split('/')){if(p==='..'){if(!parts.length)throw Error();parts.pop();}else if(p&&p!=='.')parts.push(p);}
                    const url=URL.createObjectURL(await(await localFiles.file(parts.join('/'))).getFile());urls.push(url);img.src=url;
                }catch{img.removeAttribute('src');}
            }
            if(version!==renderVersion){urls.forEach(URL.revokeObjectURL);return;}
            const oldURLs=previewURLs;previewURLs=urls;
            const darkPreview=darkThemes.has($('theme').value);
            const previewBg=darkPreview?'#202124':'#ffffff';
            const previewFg=darkPreview?'#e8e8ea':'#333333';
            const layout=`:root{--app-preview-bg:${previewBg};--app-preview-fg:${previewFg}}html,body{margin:0;min-height:100%;}body{box-sizing:border-box;padding:24px clamp(16px,3vw,36px);min-height:100vh;background-color:var(--bg-contents,var(--bg-color,var(--app-preview-bg)));color:var(--color-text,var(--text-color,var(--app-preview-fg)));}#write.reader{box-sizing:border-box;max-width:${$('docWidth').value}px;min-width:0;width:100%;margin:0 auto;min-height:calc(100vh - 48px);font-size:16px;overflow-wrap:anywhere;background-color:var(--bg-write,var(--bg-color,var(--app-preview-bg)));color:var(--color-text,var(--text-color,var(--app-preview-fg)))}img{max-width:100%;height:auto}table{max-width:100%;display:block;overflow-x:auto}#write pre{max-width:100%;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}`;
            const fontFamilies={paperlogy:'"Paperlogy 4 Regular","Paperlogy-4Regular",Paperlogy,"Malgun Gothic",sans-serif',sans:'"Malgun Gothic",sans-serif',serif:'Batang,serif',mono:'Consolas,monospace'};
            const selectedFont=fontFamilies[$('documentFont').value];
            const fontRule=selectedFont?`#write,#write *{font-family:${selectedFont}!important}`:'';
            doc.querySelectorAll('pre').forEach(pre=>{pre.classList.add('md-fences');});
            const integration=`#write.reader{box-sizing:border-box;max-width:${$('docWidth').value}px;min-width:0;width:100%;margin-left:auto;margin-right:auto;min-height:calc(100vh - 48px);}${fontRule}#write pre.md-fences{position:relative;padding:42px 18px 18px!important;border:1px solid var(--table-border-color,#8885);border-radius:8px;background:var(--code-block-bg-color,var(--bg-code-block,var(--bg-color-dark,${darkPreview?'#181a20':'#f3f4f6'})))!important;color:var(--code-block-color,var(--color-code,inherit));}#write pre.md-fences code{display:block;background:transparent!important;color:inherit!important;border:0!important;padding:0!important;box-shadow:none!important}.code-copy{position:absolute;right:9px;top:8px;padding:4px 9px;border:1px solid #8886;border-radius:5px;background:transparent;color:inherit;cursor:pointer;font:12px sans-serif}`;
            const html='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data: blob: https:; style-src \'self\' \'unsafe-inline\' https:; font-src \'self\' data: https:; form-action \'none\'; base-uri \'none\'"><style>'+layout+'</style><link rel="stylesheet" href="'+css+'"><style>'+integration+'</style></head><body><article id="write" class="reader">'+doc.body.innerHTML+'</article></body></html>';
            for(const id of [mode==='visual'?'visualPreview':'reader']){
                const host=$(id);const old=host.querySelector('iframe');
                const frame=document.createElement('iframe');frame.title=id==='reader'?'문서 미리보기':'편집 미리보기';frame.setAttribute('sandbox','allow-same-origin');
                // Same-origin permits parent scroll control; scripts remain prohibited by sandbox and CSP.
                const scroll=old?.contentDocument?.scrollingElement?.scrollTop||0;
                frame.onload=()=>{const d=frame.contentDocument;

                    // Adapt generated cards in the preview only; keep the saved HTML intact.
                    const isNeutral=color=>{
                        const probe=d.createElement('span');probe.style.color=color;d.body.append(probe);
                        const rgb=d.defaultView.getComputedStyle(probe).color.match(/[\d.]+/g)?.slice(0,3).map(Number);probe.remove();
                        return rgb && Math.max(...rgb)-Math.min(...rgb)<35;
                    };
                    const candidates=[...d.querySelectorAll('#write .profile-card,#write div[style],#write a[style],#write section[style]')].filter(el=>
                        el.matches('.profile-card') || (el.querySelector('img') && ((el.style.background && el.style.borderRadius) || (/font-family/i.test(el.getAttribute('style')||'') && /box-sizing/i.test(el.getAttribute('style')||'')))));
                    const rootStyle=d.defaultView.getComputedStyle(d.getElementById('write'));
                    const fg=rootStyle.color,bg=rootStyle.backgroundColor;
                    const surface=`color-mix(in srgb, ${bg} 92%, ${fg} 8%)`;
                    const adapted=new Set();
                    candidates.forEach(card=>{
                        card.classList.add('adaptive-profile');
                        [card,...card.querySelectorAll('*')].forEach(el=>{
                            if(el.tagName==='IMG'||adapted.has(el))return;
                            adapted.add(el);
                            const style=el.style;
                            // Preserve user accent hues on titles, badges and photo borders.
                            if(style.color && isNeutral(style.color))style.setProperty('color',fg,'important');
                            const fill=style.backgroundColor;
                            if(fill && isNeutral(fill))style.setProperty('background-color',surface,'important');
                            if(style.borderColor && isNeutral(style.borderColor))style.setProperty('border-color',`color-mix(in srgb, ${fg} 24%, transparent)`,'important');
                            if(el.matches('a,strong,b')){style.setProperty('text-decoration','none','important');style.setProperty('border-bottom','0','important');style.setProperty('box-shadow','none','important')}
                        });
                    });
                    // Scale the rendered theme typography, including fixed sizes and inline card text.
                    const ratio=Number($('fontSize').value)/16;
                    const sizes=[...d.querySelectorAll('#write,#write *')].map(el=>[el,parseFloat(d.defaultView.getComputedStyle(el).fontSize)]);
                    sizes.forEach(([el,size])=>{if(Number.isFinite(size))el.style.setProperty('font-size',`${size*ratio}px`,'important')});
                    d.querySelectorAll('pre.md-fences').forEach(pre=>{const button=d.createElement('button');button.className='code-copy';button.type='button';button.textContent='복사';button.setAttribute('aria-label','코드 복사');button.onclick=async()=>{try{await navigator.clipboard.writeText(pre.querySelector('code')?.textContent||'');button.textContent='복사됨';setTimeout(()=>button.textContent='복사',1500)}catch{button.textContent='복사 실패'}};pre.append(button)});d.scrollingElement.scrollTop=scroll;d.addEventListener('click',event=>{const link=event.target.closest('a');if(!link)return;const href=link.getAttribute('href')||'';event.preventDefault();if(href.startsWith('#'))d.getElementById(decodeURIComponent(href.slice(1)))?.scrollIntoView();});};
                frame.srcdoc=html;host.replaceChildren(frame);
            }
            setTimeout(()=>oldURLs.forEach(URL.revokeObjectURL),1000);
        }catch(error){status('미리보기 오류: '+error.message);}
    }

    function htmlToMarkdown(root) {
        let out = '';

        function walk(n) {
            if (n.nodeType === 3) return n.nodeValue;
            if (n.nodeType !== 1) return '';
            const c = [...n.childNodes].map(walk).join(''), tag = n.tagName.toLowerCase();
            if (/^h[1-6]$/.test(tag)) return '\n' + '#'.repeat(+tag[1]) + ' ' + c + '\n\n';
            if (tag === 'p' || tag === 'div') return c + '\n\n';
            if (tag === 'br') return '\n';
            if (tag === 'strong' || tag === 'b') return '**' + c + '**';
            if (tag === 'em' || tag === 'i') return '*' + c + '*';
            if (tag === 'code' && n.parentElement.tagName !== 'PRE') return '`' + c + '`';
            if (tag === 'pre') return '```\n' + n.innerText + '\n```\n\n';
            if (tag === 'li') return '- ' + c + '\n';
            if (tag === 'ul' || tag === 'ol') return c + '\n';
            if (tag === 'a') return '[' + c + '](' + n.getAttribute('href') + ')';
            if (tag === 'img') return '![' + (n.alt || '') + '](' + (n.getAttribute('src') || '') + ')';
            if (tag === 'blockquote') return c.split('\n').map(x => x ? '> ' + x : x).join('\n') + '\n\n';
            return n.outerHTML
        }out = [...root.childNodes].map(walk).join('');
        return out.trim() + '\n'
    }

    function commitVisual() {
        if (!visualChanged) return true;
        if (vditor) $('text').value = vditor.getValue();
        visualChanged = false;
        dirty = true;
        status('수정됨 · 자동 저장 대기');
        clearTimeout(timer);
        timer = setTimeout(save, 900);
        return true
    }

    async function save() {
        if (!current || !dirty) return true;
        if(demoMode || !localFiles.root){status('예시 편집 중 · 내려받기 또는 폴더 연결로 보관하세요.');return false;}
        if(save.busy)return false;
        save.busy=true; const savedPath=current, savedText=$('text').value;
        status('저장 중…');
        try {
            const d = await api('/api/file', {method: 'PUT', body: JSON.stringify({path: savedPath, content: savedText, hash: baseHash})});
            baseHash = d.hash;
            dirty = current !== savedPath || $('text').value !== savedText;
            status('원본에 저장됨 · ' + new Date().toLocaleTimeString());
            loadTree();
            return true
        } catch (e) {
            if (e.status === 409) {
                status('충돌 감지 · 현재 편집 내용 보존');
                notify('원본 파일이 다른 곳에서 바뀌어 저장을 중단했습니다. 현재 편집 내용은 그대로 남아 있습니다. 내용을 복사해 둔 뒤 파일을 다시 열어 변경 내용을 합쳐 주세요.', '저장 충돌')
            } else status('저장 실패: ' + e.message);
            return false
        } finally { save.busy=false; }
    }

    async function flushPendingChanges() {
        clearTimeout(timer);
        if (visualChanged && vditor && editorReady) {
            $('text').value = vditor.getValue();
            visualChanged = false;
            dirty = true
        }
        if(dirty && demoMode){if(!await confirmUI('예시 문서의 변경 내용을 버리고 계속할까요?'))return false;dirty=false;}
        if (dirty && !(await save())) return false;
        return !dirty
    }

    async function createFile() {
        const suggested = current ? current.split('/').pop().replace(/\.md$/i, '') + ' 새 메모.md' : '새 메모.md';
        const name = await promptUI('새 Markdown 파일 이름을 입력하세요. .md는 자동으로 붙습니다.', suggested, '새 메모 만들기');
        if (name === null || !name.trim()) return;
        if (!(await flushPendingChanges())) return;
        const parent = current ? current.split('/').slice(0, -1).join('/') : '';
        try {
            const d = await api('/api/file/create', {method:'POST', body:JSON.stringify({parent, name})});
            demoMode=false;current = d.path;
            baseHash = d.hash;
            dirty = false;
            visualChanged = false;
            rawHTML = false;
            $('text').value = '';
            $('text').disabled = false;
            $('save').disabled = false;
            $('renameFile').disabled = false;
            $('deleteFile').disabled = false;
            $('filename').textContent = current;
            await loadTree();
            if(mode==='visual')ensureVditor('');
            render();
            status('새 Markdown 파일 생성됨')
        } catch (e) {
            status(e.status === 409 ? '같은 이름의 파일이 이미 있습니다' : '파일 생성 실패: ' + e.message)
        }
    }

    async function renameFile() {
        if (!current || demoMode) return;
        const oldName = current.split('/').pop();
        const name = await promptUI('새 파일 이름을 입력하세요. 다른 폴더로 이동하지 않습니다.', oldName, '파일 이름 변경');
        if (name === null || !name.trim() || name.trim() === oldName) return;
        if (!(await flushPendingChanges())) return;
        try {
            const d = await api('/api/file/rename', {method:'POST', body:JSON.stringify({path:current, name, hash:baseHash})});
            demoMode=false;current = d.path;
            baseHash = d.hash;
            $('filename').textContent = current;
            await loadTree();
            status('파일 이름을 변경했습니다')
        } catch (e) {
            status(e.status === 409 ? (e.data?.error || '파일이 변경되어 작업을 중단했습니다') : '이름 변경 실패: ' + e.message)
        }
    }

    async function deleteFile() {
        if (!current || demoMode) return;
        const path = current;
        if (!await confirmUI(`“${path}” 파일을 삭제할까요? 이 작업은 되돌릴 수 없습니다.`, '파일 삭제', true)) return;
        if (!(await flushPendingChanges())) return;
        try {
            await api('/api/file/delete', {method:'POST', body:JSON.stringify({path, hash:baseHash})});
            current = null;
            baseHash = null;
            dirty = false;
            visualChanged = false;
            rawHTML = false;
            $('text').value = '';
            $('text').disabled = true;
            $('save').disabled = true;
            $('renameFile').disabled = true;
            $('deleteFile').disabled = true;
            $('filename').textContent = '파일을 선택하세요';
            if (vditor && editorReady) vditor.setValue('', true);
            $('reader').innerHTML = '<p class="empty">왼쪽에서 문서를 선택하세요</p>';
            await loadTree();
            status('파일을 삭제했습니다');
            render()
        } catch (e) {
            status(e.status === 409 ? (e.data?.error || '파일이 변경되어 삭제를 중단했습니다') : '파일 삭제 실패: ' + e.message)
        }
    }

    $('documentFont').value=localStorage.getItem('document-font')||'paperlogy';
    $('documentFont').onchange=()=>{localStorage.setItem('document-font',$('documentFont').value);render()};
    $('theme').value = localStorage.getItem('aichat-preview-theme') || 'less-light';
    const themeNames = {'less-light':'Less · 라이트','less-dark':'Less · 다크',adark:'Adark',alfluent:'Alfluent',drake:'Drake','drake-black':'Drake Black','drake-dark':'Drake Dark','drake-google':'Drake Google','drake-light':'Drake Light','drake-material':'Drake Material','drake-purple':'Drake Purple','drake-vue':'Drake Vue',fluent:'Fluent',github:'GitHub',mo:'Mo','mo-dark':'Mo Dark',newsprint:'Newsprint','notes-dark':'Notes Dark',pixyll:'Pixyll',whitey:'Whitey'};
    const themeColors = {'less-light':['#fff','#303038','#8e7be8'],'less-dark':['#25252b','#e7e5ed','#b9a3ff'],adark:['#22252a','#e8e8e8','#77b9d5'],alfluent:['#fff','#30343b','#0078d4'],drake:['#fff','#333','#4b8cca'],'drake-black':['#151515','#ddd','#f0c674'],'drake-dark':['#222','#ddd','#81a2be'],'drake-google':['#fff','#3c4043','#4285f4'],'drake-light':['#fff','#333','#4b8cca'],'drake-material':['#fafafa','#303030','#3f51b5'],'drake-purple':['#292633','#e5def2','#bb86fc'],'drake-vue':['#fff','#34495e','#42b983'],fluent:['#fff','#242424','#0078d4'],github:['#fff','#24292f','#0969da'],mo:['#fff','#343434','#dc4c40'],'mo-dark':['#272727','#eee','#ff7043'],newsprint:['#f4f1ea','#333','#b34a36'],'notes-dark':['#292929','#e8e8e8','#e5c454'],pixyll:['#fff','#333','#d55'],'whitey':['#fff','#333','#65a9c8']};
    const themeGrid = $('themeGrid');
    Object.entries(themeNames).forEach(([value,label]) => {
        const card=document.createElement('button'); card.type='button'; card.className='theme-card'; card.dataset.theme=value;
        const [bg,fg,accent]=themeColors[value];
        card.innerHTML='<div class="theme-swatch"><i></i><b></b><b></b></div><span class="theme-card-label"><span></span><small>적용</small></span>';
        card.querySelector('.theme-swatch').style.cssText=`--swatch-bg:${bg};--swatch-fg:${fg};--swatch-accent:${accent};color:${fg}`;
        card.querySelector('.theme-card-label span').textContent=label;
        card.setAttribute('aria-pressed',value===$('theme').value?'true':'false');
        card.addEventListener('click',()=>selectTheme(value));
        themeGrid.append(card);
    });
    function selectTheme(value) {
        $('theme').value=value;
        localStorage.setItem('aichat-preview-theme',value);
        $('themeCurrent').textContent=themeNames[value]||value;
        themeGrid.querySelectorAll('.theme-card').forEach(card=>card.setAttribute('aria-pressed',card.dataset.theme===value?'true':'false'));
        applyTheme(); render(); closeThemeDialog(); $('themePicker').focus();
    }
    function openThemeDialog(){ $('themeDialog').classList.add('open'); $('themeDialog').setAttribute('aria-hidden','false'); $('themeDialog').querySelector(`[data-theme="${CSS.escape($('theme').value)}"]`)?.focus(); }
    function closeThemeDialog(){ $('themeDialog').classList.remove('open'); $('themeDialog').setAttribute('aria-hidden','true'); }
    $('themePicker').addEventListener('click',openThemeDialog);
    $('themeDialogClose').addEventListener('click',closeThemeDialog);
    $('themeDialog').addEventListener('click',event=>{if(event.target===$('themeDialog'))closeThemeDialog()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('themeDialog').classList.contains('open')){closeThemeDialog();$('themePicker').focus()}});
    $('themeCurrent').textContent=themeNames[$('theme').value]||themeNames['less-light'];
    $('theme').addEventListener('change', () => {
        localStorage.setItem('aichat-preview-theme', $('theme').value);
        $('themeCurrent').textContent=themeNames[$('theme').value]||$('theme').value;
        themeGrid.querySelectorAll('.theme-card').forEach(card=>card.setAttribute('aria-pressed',card.dataset.theme===$('theme').value?'true':'false'));
        applyTheme();
        render()
    });
    $('docWidth').oninput = e => {setWidth(e.target.value);render();};
    $('text').addEventListener('input', () => {
        dirty = true;
        status('수정됨 · 자동 저장 대기');
        scheduleRender();
        clearTimeout(timer);
        timer = setTimeout(save, 900)
    });
    $('save').onclick = () => {
        if (commitVisual()) save()
    };
    $('createFile').onclick = createFile;
    $('renameFile').onclick = renameFile;
    $('deleteFile').onclick = deleteFile;
    for(const id of ['fileSort','fileDirection']){
        $(id).value=localStorage.getItem(id)|| (id==='fileSort'?'name':'asc');
        $(id).onchange=()=>{localStorage.setItem(id,$(id).value);loadTree().catch(error=>status('목록 불러오기 실패: '+error.message))};
    }
    $('refresh').onclick = loadTree;
    $('sidebarToggle').onclick = () => $('app').classList.toggle('sidebar-off');
    document.querySelectorAll('.modebar button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
    let searchTimer;
    $('search').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(async () => {
            const q = $('search').value.trim();
            $('results').replaceChildren();
            if (!q) {
                await loadTree();
                return
            }
            const d = await api('/api/search?q=' + encodeURIComponent(q));
            d.results.forEach(x => {
                const e = document.createElement('div');
                e.className = 'hit';
                e.textContent = x.path;
                const sm = document.createElement('small');
                sm.textContent = x.line + ': ' + x.text;
                e.append(sm);
                e.onclick = () => openFile(x.path);
                $('results').append(e)
            })
        }, 250)
    });
    $('closeModal').onclick = () => $('modal').style.display = 'none';
    init().catch(e => status('연결 실패: ' + e.message));

    // 문서 글자 크기 설정
    function setFontSize(value) {
        document.documentElement.style.setProperty(
            '--doc-font-size',
            value + 'px'
        );

        document.getElementById('fontSizeValue').textContent =
            value + 'px';

        localStorage.setItem('aichat-font-size', value);
    }

    // 이전 글자 크기 불러오기
    const savedFontSize =
        localStorage.getItem('aichat-font-size') || '16';

    const fontSlider = document.getElementById('fontSize');

    fontSlider.value = savedFontSize;

    setFontSize(savedFontSize);

    // 실시간 글자 크기 변경
    fontSlider.addEventListener('input', (e) => {
        setFontSize(e.target.value); render();
    });

</script>
